$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |+
      const qaWorkshopPackage = pm.require('@postvehicle-enterprise-team-d29a54ad-ac82-48fc-9af7-d4774bd6/qa_workshop_package');
      const responseBody = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Vin is valid", function () {
          const vin = responseBody.vehicle.vin
          console.log(vin)
          const validVin = qaWorkshopPackage.isValidVIN(vin)

          pm.expect(validVin).to.be.true;
      });


    language: text/javascript
    packages:
      "@postvehicle-enterprise-team-d29a54ad-ac82-48fc-9af7-d4774bd6/qa_workshop_package":
        id: 01a1a5d4-e74c-7690-b125-a4d9f03067cf
order: 2000
